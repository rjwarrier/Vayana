org.gradle.jvmargs=-Xmx4096m -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true
android.useAndroidX=true
android.nonTransitiveRClass=true
# KSP (Hilt/Room) doesn't support AGP 9's built-in Kotlin yet, and the classic
# org.jetbrains.kotlin.android plugin isn't compatible with AGP 9's new DSL either —
# both need to be off together. See docs/DECISIONS.md.
android.builtInKotlin=false
android.newDsl=false
kotlin.code.style=official
